services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount model dir so you can update artifacts without rebuilding the image
      - ./model:/app/model:ro
    environment:
      MODEL_DIR: model
      CORS_ORIGINS: "*"
      BATCH_LIMIT: "500"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
